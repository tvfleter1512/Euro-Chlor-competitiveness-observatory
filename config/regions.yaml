# Geography registry. EU is benchmarked against the comparator set below.
# ENTSO-E bidding-zone EIC codes are human-confirmable config (spec §3.5).
eu:
  geo_id: EU27_2020
  name: "European Union (27, 2020 composition)"
  # Member states pulled individually from Eurostat nrg_pc_205 for the country detail view
  detail_countries: [DE, FR, NL, BE, ES, IT, PL]
  # All member states, for the ECU cash cost by country (eurostat_power only;
  # Eurostat has no large-user price for CZ, LU, MT, SI)
  power_countries: [AT, BE, BG, CY, CZ, DE, DK, EE, EL, ES, FI, FR, HR, HU, IE, IT,
                    LT, LU, LV, MT, NL, PL, PT, RO, SE, SI, SK]

comparators:
  - geo_id: US
    name: "United States"
    power_source: eia            # official industrial retail price
  - geo_id: CN
    name: "China"
    power_source: proxy          # published tariffs / modelled proxy, quality_flag=estimated
  - geo_id: GULF
    name: "Gulf (GCC)"
    power_source: proxy
  - geo_id: GULF_EI
    name: "Gulf, energy-intensive tariff"
    power_source: proxy          # Saudi Heavy Consumption Tariff from 2023; eligibility unconfirmed
  - geo_id: IN
    name: "India"
    power_source: proxy

entsoe_bidding_zones:
  - geo_id: DE_LU
    name: "Germany-Luxembourg"
    eic: "10Y1001A1001A82H"
  - geo_id: FR
    name: "France"
    eic: "10YFR-RTE------C"
  - geo_id: NL
    name: "Netherlands"
    eic: "10YNL----------L"
  - geo_id: BE
    name: "Belgium"
    eic: "10YBE----------2"
  - geo_id: ES
    name: "Spain"
    eic: "10YES-REE------0"
  # Added 2026-10-28 for the ECU cash cost by country. Where a country has several
  # zones, the one with most chlor-alkali capacity: DK1 (Jutland), IT North, SE3.
  # All zones deliver CET days (checked), so Brussels-time months are right.
  - {geo_id: AT, name: "Austria", eic: "10YAT-APG------L"}
  - {geo_id: BG, name: "Bulgaria", eic: "10YCA-BULGARIA-R"}
  - {geo_id: CZ, name: "Czechia", eic: "10YCZ-CEPS-----N"}
  - {geo_id: DK_1, name: "Denmark West (DK1)", eic: "10YDK-1--------W"}
  - {geo_id: EE, name: "Estonia", eic: "10Y1001A1001A39I"}
  - {geo_id: FI, name: "Finland", eic: "10YFI-1--------U"}
  - {geo_id: EL, name: "Greece", eic: "10YGR-HTSO-----Y"}
  - {geo_id: HR, name: "Croatia", eic: "10YHR-HEP------M"}
  - {geo_id: HU, name: "Hungary", eic: "10YHU-MAVIR----U"}
