  - {geo_id: IT_NORD, name: "Italy North", eic: "10Y1001A1001A73I"}
  - {geo_id: LT, name: "Lithuania", eic: "10YLT-1001A0008Q"}
  - {geo_id: LV, name: "Latvia", eic: "10YLV-1001A00074"}
  - {geo_id: PL, name: "Poland", eic: "10YPL-AREA-----S"}
  - {geo_id: PT, name: "Portugal", eic: "10YPT-REN------W"}
  - {geo_id: RO, name: "Romania", eic: "10YRO-TEL------P"}
