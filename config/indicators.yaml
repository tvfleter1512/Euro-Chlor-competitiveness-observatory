# Competitiveness indicators (spec §9) — versioned, auditable formulas.
# The benchmarking agent computes exactly what is declared here and stores
# methodology_version with every output row.
indicators:
  electricity_cost_ratio:
    methodology_version: "v1.0"
    name: "Electricity cost ratio (EU vs comparator)"
    formula: "EU industrial delivered EUR/MWh ÷ comparator industrial delivered EUR/MWh, per period"
    inputs: ["power.industrial_delivered"]
    unit: "ratio"
    note: "Delivered price, not wholesale. Comparator rows flagged 'estimated' propagate the flag."

  trade_balance:
    methodology_version: "v1.0"
    name: "Embedded-chlorine trade balance"
    formula: "exports_eur − imports_eur per product per period, EU27 vs extra-EU"
    inputs: ["trade.value"]
    unit: "EUR"

  trade_balance_quantity:
    methodology_version: "v1.0"
    name: "Embedded-chlorine trade balance (quantity)"
    formula: "exports_t − imports_t per product per period, EU27 vs extra-EU"
    inputs: ["trade.quantity"]
    unit: "t"

  gas_hub_spread:
    methodology_version: "v1.0"
    name: "Natural-gas hub price spread (EU − US)"
    formula: "EU hub price (IMF Europe/TTF-based) − US Henry Hub, USD/MMBtu, monthly"
    inputs: ["gas.hub_price"]
    unit: "USD/MMBtu"
    note: "The causal driver behind the electricity cost ratio (assessment §2.2)."

  gas_hub_ratio:
    methodology_version: "v1.0"
    name: "Natural-gas hub price ratio (EU ÷ US)"
    formula: "EU hub price ÷ US Henry Hub, monthly"
    inputs: ["gas.hub_price"]
    unit: "ratio"

  ecu_margin_proxy:
    methodology_version: "v1.1"
    name: "EU ECU cash-margin proxy"
    formula: >
      1.128 × caustic_dry_price + 1.0 × chlorine_value_proxy − mwh_per_ecu × power_price,
      per semester. caustic_dry_price = extra-EU export unit value of CN8 28151200
      (lye) × dry_factor 2.0. chlorine_value_proxy = extra-EU export unit value of
      EDC (29031500) per tonne, applied per tonne of chlorine (mass allocation: every
      tonne of EDC valued equally, so a tonne of its chlorine carries the EDC price).
      power_price = EU27 delivered, band MWH_GE150000, X_VAT.
    inputs: ["trade.value", "trade.quantity", "power.industrial_delivered"]
    unit: "EUR/ECU"
    params:
      mwh_per_ecu: 2.629          # Industry Review 2025 — confirmed by owner 2026-07-09
      chlorine_value_basis: edc_mass_allocation   # owner decision 2026-10-08
      naoh_dry_per_ecu: 1.128     # from conversions.yaml ecu section
      caustic_dry_factor: 2.0     # 50% lye -> 100% dry basis
    params_confirmed: true        # confirmed by owner 2026-07-09 / 2026-10-08
    note: >
      Public-data proxy of ECU economics, NOT a P&L margin: excludes carbon,
      other variable costs, and uses trade unit values as price proxies.
      v1.1 (2026-10-08): v1.0 multiplied the EDC price by chlorine's mass share
      (0.716), which valued the chlorine in one tonne of EDC rather than one tonne
      of chlorine. Mass allocation still ignores the ethylene in EDC, so the
      chlorine value is an upper bound. Directional/trend use only.

  ecu_cash_cost:
    methodology_version: "v1.0"
    name: "EU ECU cash cost — measured power + Argus non-power costs"
    formula: >
      Annual, EU4 (DE/FR/BE/ES, the Argus study basis). mwh_per_ecu × measured
      power price + Argus salt + Argus other variable + Argus fixed costs for the
      same year. Measured power price = Eurostat nrg_pc_205, band MWH_GE150000,
      X_TAX (excluding taxes and levies: closest public figure to the wholesale
      price Argus assumes, p.50), mean of S1 and S2, simple mean of the four
      countries. Compared with the Argus forecast total (Fig 5-4).
    inputs: ["power.industrial_delivered", "cost.ecu_cash_cost_argus"]
    unit: "EUR/t ECU"
    params:
      mwh_per_ecu: 2.629          # Industry Review 2025 (Argus' own model implies ~2.8)
      countries: [DE, FR, BE, ES]
      tax_treatment: X_TAX
    params_confirmed: true        # owner decision 2026-10-08
    note: >
      Licensed (Argus non-power costs): member view only. Salt, other and fixed
      costs from 2022 on are Argus forecasts, not actuals. Plant-gate cash cost:
      excludes freight, depreciation, financing and separate carbon costs.

  import_penetration:
    methodology_version: "v1.0"
    name: "Import penetration — caustic soda (dry basis)"
    formula: >
      extra-EU imports (dry t) ÷ apparent consumption, where apparent consumption
      = PRODCOM sold production + extra-EU imports − extra-EU exports (all dry t).
      Dry t: solid CN8 28151100 as-is; lye 28151200 × 0.5 (NaOH content of 50% lye).
    inputs: ["production.sold_production", "trade.quantity"]
    unit: "share"
    params:
      lye_dry_content: 0.5        # CONFIRM: NaOH content of standard 50% lye
      prodcom_basis_assumed: "100% NaOH"   # CONFIRM: PRODCOM 20132525/20132527 quantity basis
    params_confirmed: false
    note: >
      Quality flag 'estimated': PRODCOM sold production excludes captive use and
      the PRODCOM quantity basis for lye needs confirmation. Trend use only.

  utilisation_gap:
    methodology_version: "v1.0"
    name: "Utilisation gap (EU − comparator)"
    formula: >
      EU operating rate − comparator operating rate, percentage points.
      Monthly vs US (Chlorine Institute); annual vs China (CCAIA annual figure).
      Periodicities are never mixed within one comparator series.
    inputs: ["production.utilisation"]
    unit: "pp"
    note: "Derived from member-restricted inputs — indicator rows carry licensed:true and are hidden in public mode."

  carbon_cost_exposure:
    methodology_version: "v1.0"
    name: "Carbon cost exposure net of indirect-cost compensation"
    formula: "EUA_price × electricity_intensity_benchmark × (1 − aid_intensity), benchmark read from benchmark_constant table with citation"
    inputs: ["carbon.eua_price", "benchmark_constant"]
    unit: "EUR/t"
    status: phase2

  cost_gap:
    methodology_version: "v2.0"
    name: "Cost gap vs comparator (EUR per tonne ECU) — compensation band"
    formula: >
      Band between two scenarios, per semester, per comparator.
      UNCOMPENSATED = (EU delivered power − comparator delivered power,
      EUR/MWh) × mwh_per_ecu. The EU delivered price already embeds the CO2
      pass-through, so no carbon term is added (v1.0 double-counted it).
      MAX-COMPENSATED = uncompensated − max_compensation, where
      max_compensation = EUA × zone emission factor × ETS benchmark intensity
      (1.846 MWh/t, regulatory — compensation is paid on the benchmark, costs
      are incurred at actual intensity) × aid intensity. Actual national
      schemes apply caps/degressivity, so reality sits inside the band;
      member states without a scheme sit at the top edge.
    inputs: ["power.industrial_delivered", "carbon.eua_price", "benchmark_constant"]
    unit: "EUR/ECU"
    params:
      mwh_per_ecu: 2.629          # membrane technology, 2025 — confirmed by owner 2026-07-09
      comparator_carbon_cost: 0.0 # no equivalent indirect carbon pricing in comparator regions
    params_confirmed: true        # confirmed by owner 2026-07-09
    note: >
      Replaces the composite index (see metric assessment §3). v2.0 fixes the
      v1.0 carbon double-count (owner review 2026-07-09): carbon pass-through
      lives inside the measured power gap; compensation is the scenario delta.

  composite_index:
    methodology_version: "v1.0"
    name: "Composite competitiveness index"
    formula: "SUPERSEDED — replaced by cost_gap (metric assessment §3: incommensurable units, unfounded weights, silent renormalisation). Retained for methodology history only."
    status: superseded_by_cost_gap
