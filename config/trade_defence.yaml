#   3907.40/390740 (only China's own reports hit). Only hits: China-Taiwan PC (above), Brazil-Thailand PC (above), Mexico PC sheets (below). A few single
#   reports did not download (BRA 308, THA 280, EGY 364, PAK 294, RUS 384, TPKM 294, ARG 350); coverage for COL,
#   CHL and GBR is partial (GBR reports only exist from 2021).
# - China AD on PC from Korea/Taiwan/Thailand/Saudi Arabia around 2018-2019: does not exist. China's reports
#   2015-2026 show only the 2022 Taiwan case (the 2018-2019 MOFCOM cases on those origins were phenol, MEK, etc.).
# - India: no DGTR polycarbonate investigation, recommendation or 'not imposed' case 2015-2026 (WTO IND reports,
#   dgtr.gov.in site search returned nothing). India's Polycarbonate (Quality Control) Order 2021 is a BIS standard
#   measure, not trade defence.
# - EU (imposer or target), US, UK, Korea, Japan, Turkey, Indonesia, GCC, Saudi Arabia: no PC resin case found.
#   Safeguards and countervailing: WTO G/SG/N and G/SCM/N series NOT swept; checked by web search only, nothing
#   found on PC resin (the Philippines 2020 resin safeguard covered HDPE/LLDPE only).
# - Out of scope (PC sheets, not primary PC): Mexico AD on polycarbonate sheets from China (HS 3916.90.91,
#   3920.61.01, 3921.19.91, 3925.90.99), initiated 14.02.2025, provisional 07.10.2025 (USD 3.6502-3.6654/kg, per WTO
#   G/ADP/N/426/MEX), final reported 08.07.2026 at USD 4.2301/kg (trade press only, not verified).
# - Not in window: Brazil's 2011-2013 PC resin investigation also covered Korea; duty applied to Thailand only per
#   the WTO report (Korea's outcome in 2013 not checked; nothing on Korea after 2015).
